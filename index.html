<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora</title>
<style>
  body{font-family:system-ui;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
  .caixa{background:#1e1e2a;padding:24px;border-radius:20px;width:min(340px,90vw)}
  input,select,button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:0;font-size:16px}
  button{background:#ffb703;font-weight:700}
  #resultado{font-size:28px;text-align:center;margin-top:12px;color:#ffb703}
</style>
</head>
<body>
<div class="caixa">
  <input id="n1" type="number" placeholder="Primeiro número">
  <input id="n2" type="number" placeholder="Segundo número">
  <select id="op">
    <option value="1">Soma</option>
    <option value="2">Subtração</option>
    <option value="3">Multiplicação</option>
    <option value="4">Divisão</option>
  </select>
  <button onclick="calcular()">Calcular</button>
  <div id="resultado"></div>
</div>

<script>
function calcular() {
  const n1 = Number(document.getElementById("n1").value);
  const n2 = Number(document.getElementById("n2").value);
  const op = document.getElementById("op").value;
  let resultado;

  if (op === "1") resultado = n1 + n2;
  else if (op === "2") resultado = n1 - n2;
  else if (op === "3") resultado = n1 * n2;
  else if (op === "4") {
    if (n2 === 0) resultado = "Erro: divisão por zero";
    else resultado = n1 / n2;
  }

  document.getElementById("resultado").textContent = resultado;
}
</script>
</body>
</html>
